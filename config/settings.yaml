# Which content profiles are switched on. Each profile lives in config/profiles/<name>.yaml
# and reads scripts from content/queue/<name>/.
active_profiles:
  - insurance
  - stories
  - general

# Which profile "/idea <text>" uses when you don't name one
# ("/idea story: ..." picks stories, "/idea general: ..." picks general).
idea_default_profile: insurance

# Timezone used for the posting schedule.
timezone: Asia/Kuala_Lumpur
