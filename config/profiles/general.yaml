# Content profile: anything that isn't insurance or fiction (tips, explainers, motivation, events...).
# Use it on Telegram with:  /idea general: 3 study habits that actually work

name: general
aliases: [gen, misc, other, tips]
description: Short, clear explainer reels on any everyday topic, friendly and practical.

instagram:
  user_id_secret: IG_USER_ID
  token_secret: IG_ACCESS_TOKEN
  trial_reel: true
  graduation: MANUAL

video_style: ai_visuals

visuals:
  style: "bright modern flat illustration, clean shapes, cheerful colours, minimal text, high quality"
  steps: 6

posting: manual

schedule:       # only used with posting: auto
  days: [Fri]
  hour: 20
  max_per_day: 1
  catch_up_hours: 24

voice:
  name: en-US-AndrewNeural
  rate: "+6%"
  fallback: en-US-GuyNeural

style:
  series_label: ""
  handle: "@jx_mlg777"
  bg_top: "#12343B"
  bg_bottom: "#081A1E"
  text: "#FFFFFF"
  muted: "#A7C4C9"
  accent: "#FFD166"
  font_bold: Inter-Bold
  font_regular: Inter-Medium
  caption_size: 92
  caption_uppercase: true
  music: ""
  music_volume: 0.10

caption:
  footer: ""
  default_hashtags: ["#tips", "#learnontiktok", "#explained"]

rules:
  - Practical and accurate; no medical, legal or financial advice.
  - Simple words, short sentences, one idea per scene.
  - Open with a hook in the first line; end on a clear takeaway.
  - No calls to action of any kind (no "follow", "like", "share", "comment").

banned_phrases:
  - follow for
  - follow to
  - follow along
  - follow if
  - give it a follow
  - follow me
  - hit follow
  - like and subscribe
  - subscribe
  - comment below
