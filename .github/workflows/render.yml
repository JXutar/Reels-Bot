name: Render new reels

# Runs when you add new script files to content/queue/, or when you press "Run workflow".
on:
  push:
    paths: ["content/queue/**"]
  workflow_dispatch:
    inputs:
      remake:
        description: "Remake reels that aren't posted yet: type a reel id, or 'all'. Leave empty to just render new scripts."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: reels-bot-state   # never runs at the same time as the hourly tick
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Render, host, and send to Telegram for review
        run: python -m bot render --remake "$REMAKE"
        env:
          REMAKE: ${{ github.event.inputs.remake }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - name: Save state
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || (git commit -m "Update state [skip ci]" && git pull --rebase && git push)
