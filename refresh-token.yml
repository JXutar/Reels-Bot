name: Refresh Instagram token

# Instagram tokens expire after 60 days. This renews them on the 1st and 15th of every month
# and saves the new token back into the repo's secrets (needs the GH_PAT secret, see README).
on:
  schedule:
    - cron: "41 3 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m bot refresh-token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Store new token(s) as secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for f in "$RUNNER_TEMP"/new_tokens/*; do
            gh secret set "$(basename "$f")" --repo "$GITHUB_REPOSITORY" < "$f"
            echo "Updated secret $(basename "$f")"
          done
